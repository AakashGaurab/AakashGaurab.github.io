<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%SITE_TITLE%</title>
    <meta
      name="description"
      content="%SITE_DESCRIPTION%"
    />
    <meta
      property="og:title"
      content="%SITE_TITLE%"
    />
    <meta
      property="og:description"
      content="%SITE_DESCRIPTION%"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-[var(--color-bg,#09090b)] text-[#f4f4f5] antialiased selection:bg-[var(--color-primary,#8b5cf6)]/30 selection:text-white min-h-screen"
  >
    <!-- Loader shown while main.tsx fetches the site content; React replaces it on render. -->
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center">
        <div
          style="width: 32px; height: 32px; border: 2px solid #8b5cf6; border-top-color: transparent; border-radius: 50%; animation: boot-spin 0.8s linear infinite"
        ></div>
      </div>
      <style>
        @keyframes boot-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
